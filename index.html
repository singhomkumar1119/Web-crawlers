<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spider Web Crawler</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="content">
    <p class="target-line">Here is a line of text the spider will crawl across.</p>
    <a href="#" class="target-line">Here is a link anchor.</a>
  </div>

  <!-- The Spider Sprite -->
  <div id="spider" class="spider">
    <div class="body"></div>
    <div class="legs leg-left"></div>
    <div class="legs leg-right"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
