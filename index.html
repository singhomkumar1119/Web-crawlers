<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Spider Crawler</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b1020; }

    .spider {
      position: fixed;
      width: 44px;
      height: 44px;
      transform-origin: center;
      pointer-events: none;
      z-index: 9999;
    }

    .body {
      position: absolute;
      inset: 12px;
      background: #111;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0,0,0,.6);
    }

    .leg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 3px;
      background: #111;
      transform-origin: left center;
    }
  </style>
</head>
<body>
  <div class="spider" id="spider">
    <div class="body"></div>
    <div class="leg" style="transform: rotate(20deg)"></div>
    <div class="leg" style="transform: rotate(60deg)"></div>
    <div class="leg" style="transform: rotate(110deg)"></div>
    <div class="leg" style="transform: rotate(160deg)"></div>
    <div class="leg" style="transform: rotate(200deg)"></div>
    <div class="leg" style="transform: rotate(250deg)"></div>
    <div class="leg" style="transform: rotate(300deg)"></div>
    <div class="leg" style="transform: rotate(340deg)"></div>
  </div>

  <script src="spider.js"></script>
</body>
</html>
